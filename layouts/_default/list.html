{{ define "main" }}
<div class="wrap narrow">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{ with .RegularPages }}
    <ul class="plain-list">
      {{ range . }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  {{ end }}
</div>
{{ end }}
