<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-mark" aria-hidden="true">&#9654;</span>
      <span class="brand-text">
        <span class="brand-title">Tech Leadership</span>
        <span class="brand-sub">Deep Dives</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="nav-cta" href="{{ .Site.Params.youtube }}" rel="noopener">YouTube</a>
    </nav>
  </div>
</header>
